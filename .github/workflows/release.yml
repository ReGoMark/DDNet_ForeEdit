name: Build and Release (Windows)

on:
  push:
    tags:
      - 'v*'            # 仅当 push 的 tag 以 v 开头触发，例如 v26.02.905.13
  workflow_dispatch:    # 手动触发

permissions:
  contents: write       # 需要写入 release/上传资产

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DNFE.slnx

      - name: Publish (Release, win-x64, framework-dependent)
        run: dotnet publish FontEditor.vbproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o publish

      - name: Read Version from project (fallback to tag)
        id: get_version
        shell: pwsh
        run: |
          try {
            [xml]$xml = Get-Content FontEditor.vbproj
            $ver = $xml.Project.PropertyGroup.Version
          } catch {
            $ver = ""
          }
          if (-not $ver) {
            # GITHUB_REF_NAME is set for tag-triggered runs; on manual runs it may be empty
            $ver = $env:GITHUB_REF_NAME
          }
          if (-not $ver) {
            $ver = $env:GITHUB_SHA.Substring(0,8)
          }
          Write-Host "Determined version: $ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"

      - name: Create release dir and zip
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.version }}"
          $zipPath = "release/DDNet_ForeEdit-$ver.zip"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          if (Test-Path publish) {
            Compress-Archive -Path publish\* -DestinationPath $zipPath -Force
          } else {
            Write-Error "Publish folder not found"
            exit 1
          }
          Write-Host "Created $zipPath"
        env:
          GITHUB_OUTPUT: ${{ github.outputs || '' }}

      - name: Create GitHub Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref }}
          name: ${{ steps.get_version.outputs.version }}
          body: "Release ${{ steps.get_version.outputs.version }} (automated build)"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/DDNet_ForeEdit-${{ steps.get_version.outputs.version }}.zip
          asset_name: DDNet_ForeEdit-${{ steps.get_version.outputs.version }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}