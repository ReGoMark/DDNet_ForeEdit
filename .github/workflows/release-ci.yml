name: Build, zip and publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find solution and project
        id: find
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path . -Recurse -Filter *.sln -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sln) { Write-Error "No .sln found in repository"; exit 1 }
          $vbproj = Get-ChildItem -Path . -Recurse -Filter *.vbproj -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vbproj) { Write-Error "No .vbproj found in repository"; exit 1 }
          echo "SOLUTION_PATH=$($sln.FullName)" >> $env:GITHUB_OUTPUT
          echo "VBPROJ_PATH=$($vbproj.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore "${{ steps.find.outputs.SOLUTION_PATH }}"
        shell: pwsh

      - name: Test (if present)
        run: |
          $tests = Get-ChildItem -Path . -Recurse -Filter *.Tests*.vbproj -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tests) { dotnet test $tests.FullName --no-build } else { Write-Host "No test project found; skipping tests." }
        shell: pwsh

      - name: Publish (win-x64)
        run: dotnet publish "${{ steps.find.outputs.VBPROJ_PATH }}" -c Release -r win-x64 --self-contained false -o ./publish
        shell: pwsh

      - name: Show publish files
        run: Get-ChildItem -Path ./publish -Recurse | ForEach-Object { $_.FullName }
        shell: pwsh

      - name: Zip publish folder
        run: Compress-Archive -Path ./publish/* -DestinationPath ./${{ github.ref_name }}.zip -Force
        shell: pwsh

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: Automated release from CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./${{ github.ref_name }}.zip
          asset_name: MyApp-${{ github.ref_name }}.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
